# req-response Exporter Test Configuration with OTLP Receiver
#
# This configuration sets up an OTLP gRPC receiver that accepts telemetry
# from instrumented applications and forwards it to req-response.
#
# Usage:
#   ./df_engine --config otlp-req-response.yaml --num-cores 1
#
# Send data to this collector using:
#   - OTLP/gRPC endpoint: localhost:4317
#
# NOTE: Environment Variable Support
# -----------------------------------
# The current config system does NOT support environment variable substitution (e.g., ${ENV_VAR}).
# This is documented as a future enhancement in the config layer roadmap.
#
# Workarounds for sensitive data:
# 1. Use a template processor (envsubst, sed) before passing to df_engine:
#    envsubst < otlp-req-response.yaml | ./df_engine --config /dev/stdin
#
# 2. Generate the config file at deployment time with your CI/CD tooling
#
# 3. For Kubernetes: Use a ConfigMap with values injected from Secrets

version: otel_dataflow/v1

policies:
  channel_capacity:
    control:
      node: 100
      pipeline: 100
    pdata: 128

engine: {}

groups:
  default:
    pipelines:
      main:
        nodes:
          # OTLP gRPC Receiver - Accepts telemetry from instrumented apps
          otlp-receiver:
            type: "urn:otel:receiver:otlp"
            config:
              protocols:
                grpc:
                  # The address to listen on for gRPC connections
                  listening_addr: "127.0.0.1:4317"

          # req-response exporter configuration
          req-response-exporter:
            type: "urn:microsoft:exporter:req-response"
            config:
              # ============================================================
              # REQUIRED FIELDS - Replace with your req-response exporter config values
              # ============================================================
                listen_addr: "0.0.0.0:9000"     # TCP server: client sends GET/ACK here
                max_items: 10000                # FIFO depth
                max_total_bytes: 67108864       # 64MiB
                ack_timeout_ms: 30000           # wait for client ACK
                ack_upstream_on_enqueue: true   # ack pipeline immediately

        connections:
          - from: otlp-receiver
            to: req-response-exporter
